name: Smoke

# Kept separate from CI on purpose: this workflow talks to AGE and its
# third-party players, so it turns red when the site changes, moves domain,
# or a mirror goes down. Mixing that signal into the PR gate would train
# everyone to ignore a red check.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # No pycryptodome: exercise the pure-Python AES path that a-Shell uses.
      - name: Install package
        run: python -m pip install -e .

      - name: Run AGE smoke tests
        env:
          AGECAT_RUN_INTEGRATION: "1"
        run: python -m unittest tests.test_integration_smoke -v
