repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check .
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: ruff check .
        language: system
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: pyright
        language: system
        pass_filenames: false

      - id: unittest
        name: unittest
        entry: python -m unittest
        language: system
        pass_filenames: false

