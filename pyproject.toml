[project]
name = "agecat"
version = "0.1.0"
description = "AGE (agedm) anime downloader CLI with resumable MP4 and HLS downloads."
authors = [
    {name = "HeiTang",email = "heitang.me@gmail.com"},
    {name = "alec-kana"}
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]

[project.optional-dependencies]
# Faster AES for encrypted HLS mirrors; optional so pure-Python installs (a-Shell) work.
fast = ["pycryptodome (>=3.23.0,<4.0.0)"]

[project.scripts]
agecat = "agecat.cli:main"

[tool.poetry]
packages = [{include = "agecat", from = "src"}]
include = ["src/agecat/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "UP",
]
ignore = [
    "RUF001",
]

[tool.pyright]
include = ["src/agecat", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.5.0,<5.0.0)",
    "ruff (>=0.15.14,<0.16.0)",
    "pyright (>=1.1.409,<2.0.0)"
]
